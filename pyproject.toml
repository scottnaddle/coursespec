[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coursespec"
version = "0.3.0"
description = "LMS 중립 과정 설계서(CourseSpec)와 Moodle·Canvas 퍼블리셔"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "ruamel.yaml>=0.18", "jsonschema>=4.18", "markdown>=3.5", "lxml>=5"]

[project.optional-dependencies]
test = ["pytest>=8"]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pypdf>=4",
    "python-docx>=1.1",
    "httpx>=0.27",
]

[project.scripts]
coursespec = "coursespec.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coursespec"]

[tool.hatch.build.targets.wheel.force-include]
"schema/coursespec.schema.json" = "coursespec/coursespec.schema.json"
"schema/imscc" = "coursespec/schema/imscc"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
