name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test,web]"
      - run: pytest -q
      - name: Lint examples
        run: coursespec lint examples/ai-agent-education.coursespec.yaml examples/design-agent-demo/course.coursespec.yaml
